name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ECommerceMicroservices.slnx

      - name: Build
        run: dotnet build ECommerceMicroservices.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ECommerceMicroservices.slnx --no-build --configuration Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

  build-and-push:
    needs: [backend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ProductCatalog
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/Services/ProductCatalog/ECommerce.ProductCatalog.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/anuraggupta819/cartify-productcatalog-api:latest
            ghcr.io/anuraggupta819/cartify-productcatalog-api:${{ github.sha }}

      - name: Build and push Identity
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/Services/Identity/ECommerce.Identity.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/anuraggupta819/cartify-identity-api:latest
            ghcr.io/anuraggupta819/cartify-identity-api:${{ github.sha }}

      - name: Build and push Gateway
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/Gateway/ECommerce.Gateway.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/anuraggupta819/cartify-gateway-api:latest
            ghcr.io/anuraggupta819/cartify-gateway-api:${{ github.sha }}

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App images
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name cartify-api \
              --resource-group cartify-rg \
              --image ghcr.io/anuraggupta819/cartify-productcatalog-api:${{ github.sha }}
            az containerapp update \
              --name cartify-identity \
              --resource-group cartify-rg \
              --image ghcr.io/anuraggupta819/cartify-identity-api:${{ github.sha }}
            az containerapp update \
              --name cartify-gateway \
              --resource-group cartify-rg \
              --image ghcr.io/anuraggupta819/cartify-gateway-api:${{ github.sha }}
