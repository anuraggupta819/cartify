services:
  product-catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: productcatalogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - product-catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-catalog-api:
    build:
      context: .
      dockerfile: src/Services/ProductCatalog/ECommerce.ProductCatalog.Api/Dockerfile
    ports:
      - "5101:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProductCatalogDb: "Host=product-catalog-db;Port=5432;Database=productcatalogdb;Username=postgres;Password=postgres"
    depends_on:
      product-catalog-db:
        condition: service_healthy

volumes:
  product-catalog-db-data:
